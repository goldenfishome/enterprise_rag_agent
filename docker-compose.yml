# docker-compose.yml
# Local development environment: start Qdrant and Redis infrastructure
# Usage: docker-compose up -d

version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: rag_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional: run the RAG API locally (build the image first)
  # rag_api:
  #   build: .
  #   container_name: rag_api
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  #   depends_on:
  #     qdrant:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  qdrant_data:
  redis_data:
